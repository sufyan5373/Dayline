<style>
/* Layout: phone-app column on a light grey ground. Pill nav, oversized date, pastel task cards on a white panel; widens to a card grid on desktop. */
:root{
  --bg:#E6E6E2; --surface:#FFFFFF; --surface-2:#F0F0ED; --ink:#111112; --muted:#5E5E59; --line:rgba(17,17,18,.13);
  --pill-on:#0B0B0C; --pill-on-ink:#FFFFFF;
  --c-amber:#E9B45F; --c-sage:#B9C4B8; --c-lav:#B9A8DA; --c-rose:#CC8E99; --c-teal:#8FD1C8; --c-lime:#CDD88F;
  --on-card:#171512; --on-card-2:rgba(23,21,18,.72); --chip:#2A241D; --chip-ink:#FFFFFF; --glass:rgba(255,255,255,.55);
  --ok:#2C7549; --alert:#B3401E;
  --f-display:'Inter Tight','Helvetica Neue',Arial,sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E0F; --surface:#19191B; --surface-2:#242427; --ink:#F2F2EE; --muted:#A0A09A; --line:rgba(255,255,255,.15);
    --pill-on:#F2F2EE; --pill-on-ink:#0E0E0F; --ok:#6FC896; --alert:#F2906C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E0F; --surface:#19191B; --surface-2:#242427; --ink:#F2F2EE; --muted:#A0A09A; --line:rgba(255,255,255,.15);
  --pill-on:#F2F2EE; --pill-on-ink:#0E0E0F; --ok:#6FC896; --alert:#F2906C; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-block:10px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
.app{max-width:760px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.c-amber{background:var(--c-amber)}.c-sage{background:var(--c-sage)}.c-lav{background:var(--c-lav)}
.c-rose{background:var(--c-rose)}.c-teal{background:var(--c-teal)}.c-lime{background:var(--c-lime)}

.credit{text-align:center;font-size:12px;color:var(--muted);padding-block:36px 8px;letter-spacing:.01em}

/* top bar */
.bar{display:flex;align-items:center;gap:8px;padding-block:6px 10px}
.nav{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding:2px}
.nav::-webkit-scrollbar{display:none}
.pill{height:42px;padding:0 17px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;font-size:14px;white-space:nowrap;flex:none}
.pill[aria-current="page"]{background:var(--pill-on);color:var(--pill-on-ink);border-color:var(--pill-on)}
.pill.sm{height:34px;padding:0 14px;font-size:13px;background:var(--surface-2)}
.circ{position:relative;width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center}
.circ .st{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--alert);border:2px solid var(--surface)}
.circ .st.ok{background:var(--ok)}
@media (max-width:600px){.nav{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}}

/* hero (today) */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-block:20px 24px}
.dow{font-size:14px;color:var(--muted);margin-bottom:6px}
.bigdate{font-family:var(--f-display);font-weight:400;font-size:clamp(66px,20vw,108px);line-height:.9;letter-spacing:-.045em;text-transform:uppercase}
.clocks{display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--line);padding-left:14px;min-width:0;margin-bottom:6px}
.clk b{display:block;font:500 clamp(18px,5vw,22px)/1.1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clk span{font-size:12px;color:var(--muted)}
.vh{padding-block:18px 14px}
.vh h1{font:400 clamp(40px,11vw,60px)/.95 var(--f-display);letter-spacing:-.04em}
.vh p{color:var(--muted);margin-top:8px}

/* panels and notices */
.panel{background:var(--surface);border-radius:28px;padding:16px 14px 18px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:2px 4px 10px}
.sec-h h2{font-size:13px;font-weight:600}
.sub-h{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:20px 4px 10px}
.prog{display:flex;align-items:center;gap:12px;padding:0 4px 14px}
.prog span{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar-t{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar-t i{display:block;height:100%;border-radius:inherit;background:var(--ink)}
.notice{background:var(--surface);border-radius:22px;padding:14px 16px;display:flex;gap:12px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.notice .nt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 220px}
.notice .nt span{color:var(--muted)}
.notice .na{display:flex;gap:8px;flex-wrap:wrap}
.btn-solid,.btn-ghost,.btn-dark{height:40px;padding:0 16px;border-radius:999px;font-weight:500;font-size:13px;border:1px solid transparent}
.btn-solid{background:var(--pill-on);color:var(--pill-on-ink)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost.danger{color:var(--alert)}
.btn-dark{background:var(--chip);color:var(--chip-ink);height:38px}

/* task cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{position:relative;border-radius:var(--r);padding:18px 18px 16px;color:var(--on-card);display:flex;flex-direction:column;gap:16px}
.card[data-card]{cursor:pointer}
.card.done{opacity:.62}
.card.done h3{text-decoration:line-through}
.flags{display:flex;gap:6px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card h3{font:500 clamp(24px,6.6vw,30px)/1.03 var(--f-display);letter-spacing:-.03em;min-width:0;overflow-wrap:anywhere}
.ttl,.rtt{background:none;border:0;padding:0;text-align:left;font:inherit;letter-spacing:inherit;color:inherit;cursor:pointer}
.tag{font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--glass);white-space:nowrap;flex:none}
.times{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.t b{display:block;font:500 17px var(--f-display);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.t small{font-size:11px;color:var(--on-card-2)}
.t.r{text-align:right}
.dur{display:inline-block;background:var(--chip);color:var(--chip-ink);font-size:12px;padding:5px 12px;border-radius:999px}
.acts{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.nag{font-size:12px;color:var(--on-card-2);min-width:0}
.card .btn-ghost{border-color:rgba(23,21,18,.4);color:var(--on-card)}
.meta{font-size:12px;color:var(--on-card-2)}
.card .bar-t{background:rgba(23,21,18,.16)}
.card .bar-t i{background:var(--chip)}
.steps,.chaps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps li,.chap{display:flex;align-items:center;gap:10px;min-height:40px}
.steps li span,.chap span.cn{min-width:0;overflow-wrap:anywhere;flex:1}
.strike{text-decoration:line-through;opacity:.7}
.sb{width:30px;height:30px;flex:none;border-radius:50%;border:1.5px solid var(--on-card);background:transparent;color:var(--chip-ink);display:grid;place-items:center;padding:0}
.sb svg{opacity:0}
.sb[aria-pressed="true"]{background:var(--chip);border-color:var(--chip)}
.sb[aria-pressed="true"] svg{opacity:1}
.chip{background:var(--chip);color:var(--chip-ink);border:0;border-radius:9px;padding:5px 10px;font-size:12px;text-align:left;overflow-wrap:anywhere;min-width:0}
.chip.cls{background:transparent;color:var(--on-card);box-shadow:inset 0 0 0 1px rgba(23,21,18,.5)}
.chip.goal{background:transparent;color:var(--on-card);box-shadow:inset 0 0 0 1px rgba(23,21,18,.5);font-weight:600}
.chip.ghost{background:transparent;color:var(--on-card);box-shadow:inset 0 0 0 1px rgba(23,21,18,.5);flex:none}
.chip.nw{white-space:nowrap;flex:none}

/* compact rows */
.row{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:18px;padding:10px 14px 10px 10px;cursor:pointer}
.chk{width:40px;height:40px;flex:none;border-radius:50%;border:1.5px solid var(--ink);background:transparent;display:grid;place-items:center;color:var(--pill-on-ink);padding:0}
.chk svg{opacity:0}
.chk[aria-pressed="true"]{background:var(--ink)}
.chk[aria-pressed="true"] svg{opacity:1}
.rt{display:flex;flex-direction:column;min-width:0;flex:1}
.rtt{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.rt span{font-size:12px;color:var(--muted)}
.wk{display:flex;gap:4px;flex:none}
.wk i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.wk i.on{background:var(--ink)}
.sq{width:10px;align-self:stretch;border-radius:6px;flex:none;margin-left:6px}
.empty{color:var(--muted);padding:14px 6px}

/* calendar */
.monthbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-block:6px 14px;font:500 20px var(--f-display);letter-spacing:-.02em;text-transform:uppercase}
.side{background:none;border:0;color:var(--muted);font:inherit;letter-spacing:inherit;text-transform:inherit;min-height:44px;padding:0}
.side.l{text-align:left}.side.r{text-align:right}
.cur{display:flex;align-items:center;gap:4px}
.chev{width:40px;height:40px;border:0;background:none;display:grid;place-items:center;border-radius:50%;padding:0}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;background:var(--surface);border-radius:26px;padding:14px;margin-bottom:12px}
.dh{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.06em;padding-bottom:4px}
.day{aspect-ratio:1/1;max-height:64px;width:100%;border-radius:16px;border:0;background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:500 15px var(--f-display);padding:0;font-variant-numeric:tabular-nums}
.day.today{background:var(--pill-on);color:var(--pill-on-ink)}
.day.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.day.today.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:10px}
.dcard{position:relative;border-radius:var(--r);padding:16px 16px 56px;color:var(--on-card);display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;min-height:170px}
.dcard.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.dw{font-size:13px;margin-bottom:6px}
.dn{font:400 54px/.9 var(--f-display);letter-spacing:-.05em;text-transform:uppercase}
.ev{display:flex;flex-direction:column;gap:8px;min-width:0}
.evrow{display:flex;gap:8px;align-items:center;min-width:0}
.evt{font-size:11px;width:58px;flex:none;font-variant-numeric:tabular-nums;color:var(--on-card-2)}
.addc{position:absolute;right:14px;bottom:14px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(23,21,18,.45);background:transparent;color:var(--on-card);display:grid;place-items:center;padding:0}
.dcard .empty{color:var(--on-card-2);padding:0}

/* goals, syllabus, timetable */
.stats{background:var(--surface);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:14px;margin-bottom:12px}
.stat{display:grid;grid-template-columns:104px minmax(0,1fr) 44px;align-items:center;gap:12px;font-size:13px}
.stat b{text-align:right;font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:10px;align-items:start}
summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:12px}
summary::-webkit-details-marker{display:none}
.subj .more{font-size:12px;color:var(--on-card-2)}
.subj .more::after{content:" · Show chapters"}
.subj[open] .more::after{content:" · Hide chapters"}
.subj .body{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 12px}
.tabs::-webkit-scrollbar{display:none}
.tabs .pill{position:relative}
.tabs .pill[aria-pressed="true"]{background:var(--pill-on);color:var(--pill-on-ink);border-color:var(--pill-on)}
.cls-card{flex-direction:row;gap:16px;align-items:stretch}
.cls-card .t{min-width:76px}
.cls-card .t b{font-size:20px}
.cls-card .cb{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.cls-card h3{font-size:clamp(22px,6vw,26px)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding-inline:env(safe-area-inset-left,0px)}
.sheet{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--surface);color:var(--ink);border-radius:28px 28px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.scrim{align-items:center;padding:24px}.sheet{border-radius:28px;max-height:88vh}}
.sheet h2{font:500 26px/1.05 var(--f-display);letter-spacing:-.03em;margin-bottom:14px}
.sheet h3{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:20px 0 8px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.seg-b{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:13px;font-weight:500}
.seg-b[aria-pressed="true"]{background:var(--pill-on);color:var(--pill-on-ink);border-color:var(--pill-on)}
.fields{display:flex;flex-direction:column;gap:14px}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500;color:var(--muted);min-width:0}
.lab{font-size:12px;font-weight:500;color:var(--muted)}
input[type=text],input[type=date],input[type=time],select,textarea{font:400 16px var(--f-body);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
textarea{resize:vertical;min-height:110px}
.tf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tf select{padding:10px 6px;text-align:center;text-align-last:center}
.fg.tg{grid-template-columns:minmax(0,1fr)}
.ck{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink);min-height:44px}
.ck input{width:20px;height:20px;accent-color:var(--ink);flex:none}
.sws{display:flex;gap:10px;flex-wrap:wrap;padding:4px 4px 2px}
.sw{position:relative;width:36px;height:36px;border-radius:50%;display:inline-block;cursor:pointer}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw:has(input:checked){box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.sw:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:4px}
.dayset{display:flex;flex-wrap:wrap;gap:6px}
.dayset label{position:relative}
.dayset input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.dayset span{display:grid;place-items:center;min-width:46px;height:40px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:500}
.dayset input:checked + span{background:var(--pill-on);color:var(--pill-on-ink);border-color:var(--pill-on)}
.dayset input:focus-visible + span{outline:2px solid var(--ink);outline-offset:2px}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.err{color:var(--alert);font-size:13px;margin-top:12px}
.stat-line{color:var(--muted);margin-bottom:12px}
.logl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.logl li{display:flex;gap:10px;font-size:13px}
.logl time{color:var(--muted);flex:none;width:64px;font-variant-numeric:tabular-nums}
.fine{font-size:12px;color:var(--muted);margin-top:16px}

/* sync + swipe */
.codebox{font:600 clamp(22px,7vw,30px)/1.2 var(--f-display);letter-spacing:.08em;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:center;user-select:all;-webkit-user-select:all;margin-bottom:10px}
#view{touch-action:pan-y}
@media (prefers-reduced-motion:no-preference){
  #view.sl-next{animation:slnext .24s ease-out}
  #view.sl-prev{animation:slprev .24s ease-out}
  @keyframes slnext{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}
  @keyframes slprev{from{transform:translateX(-36px);opacity:0}to{transform:none;opacity:1}}
}

/* files: notes + past papers */
.chap{flex-wrap:wrap}
.chap .cn{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:40px}
.fcount{display:inline-block;margin-left:8px;min-width:20px;padding:0 6px;border-radius:999px;background:var(--chip);color:var(--chip-ink);font-size:11px;line-height:20px;text-align:center;vertical-align:middle}
.fchips{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 0 8px 40px}
.fchips.sf{padding:6px 0 0}
.fchips .chip{min-height:34px;padding:6px 13px;border-radius:999px;font-size:12.5px}
.flist{list-style:none;margin:0 0 4px;padding:0;display:flex;flex-direction:column;gap:8px}
.fli{display:flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:20px;padding:6px 6px 6px 8px}
.fi{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:4px;text-align:left}
.ftype{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;font:600 11px var(--f-display);letter-spacing:.04em;color:var(--on-card)}
.fx{display:flex;flex-direction:column;min-width:0;gap:2px}
.fn{font-weight:600;font-size:14px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fm{font-size:12px;color:var(--muted)}
.ib{min-width:44px;height:44px;flex:none;border-radius:999px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink);padding:0}
.ib:hover{background:var(--line)}
.ib.armed{padding:0 14px;font-size:12px;font-weight:600;color:var(--alert)}
/* Word reader */
.dv{position:fixed;inset:0;z-index:2100;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;font-family:var(--f-body)}
.dv-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.dv-t{flex:1;min-width:0;font:600 15px var(--f-display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 10px calc(40px + env(safe-area-inset-bottom,0px))}
.dv-page{max-width:780px;margin:0 auto;background:var(--surface);border-radius:22px;padding:22px 20px;font-size:var(--dv-fs,16px);line-height:1.6;overflow-wrap:anywhere}
.dv-page h1,.dv-page h2,.dv-page h3{font-family:var(--f-display);letter-spacing:-.02em;line-height:1.15;margin:1.1em 0 .4em}
.dv-page p{margin:0 0 .8em}
.dv-page img{max-width:100%;height:auto}
.dv-page table{border-collapse:collapse;display:block;max-width:100%;overflow-x:auto;margin-bottom:1em}
.dv-page td,.dv-page th{border:1px solid var(--line);padding:6px 9px;vertical-align:top}
.dv-page a{color:inherit;text-decoration:underline}
.dv-msg{text-align:center;color:var(--muted);padding:40px 12px}

/* toasts */
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:2200;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{pointer-events:auto;width:100%;max-width:460px;background:var(--pill-on);color:var(--pill-on-ink);border-radius:18px;padding:12px 8px 12px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.toast .tt{display:flex;flex-direction:column;flex:1;min-width:0;font-size:13px}
.toast .tt span{opacity:.82;overflow-wrap:anywhere}
.toast .tbtn{background:var(--pill-on-ink);color:var(--pill-on);border:0;border-radius:999px;height:36px;padding:0 14px;font-weight:600;font-size:13px}
.toast .tx{background:none;border:0;width:40px;height:40px;display:grid;place-items:center;color:inherit;padding:0}
@media (prefers-reduced-motion:no-preference){.toast{animation:in .22s ease-out}@keyframes in{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}}
</style>
</head>
<body>


<div class="app">
  <div id="toasts" aria-live="polite"></div>
  <header class="bar">
    <nav class="nav" id="nav" aria-label="Sections">
      <button class="pill" data-a="nav" data-v="today">Today</button>
      <button class="pill" data-a="nav" data-v="calendar">Calendar</button>
      <button class="pill" data-a="nav" data-v="goals">Goals</button>
      <button class="pill" data-a="nav" data-v="syllabus">Syllabus</button>
      <button class="pill" data-a="nav" data-v="timetable">Timetable</button>
    </nav>
    <button class="circ" id="bell" data-a="bell" aria-label="Reminder settings"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 17h12l-1.6-2.2V10a4.4 4.4 0 0 0-8.8 0v4.8L6 17zm4.2 2.4a1.9 1.9 0 0 0 3.6 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><i class="st"></i></button>
    <button class="circ" data-a="add" aria-label="Add something new"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  </header>
  <main id="view"></main>
  <footer class="credit">Made by Muhammad Sufyan Sarwar</footer>
</div>
<div class="scrim" id="scrim" hidden></div>
<script src="/pdf-viewer.js"></script>

<script>
(function(){
'use strict';
var KEY='dayline.v1';
var VIEWS=['today','calendar','goals','syllabus','timetable'];
var COLORS=['amber','sage','lav','rose','teal','lime'];
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var DOWL=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
var IC={
  share:'<svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  trash:'<svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',

function viewToday(){

function go(v,dir){

function idb(){return new Promise(function(res,rej){
  var r=indexedDB.open('dayline-files',1);
  r.onupgradeneeded=function(){var d=r.result;d.createObjectStore('meta',{keyPath:'id'});d.createObjectStore('blobs')};

function tx(stores,mode,fn){return new Promise(function(res,rej){
  var t=FDB.transaction(stores,mode),rq;
  t.oncomplete=function(){res(rq&&rq.result)};t.onerror=t.onabort=function(){rej(t.error)};
  rq=fn(t);
})}

async function fileAdd(f,sid,cid,kind,ext){

  var m={id:uid()+uid(),sid:sid,cid:cid,kind:kind,name:f.name,ext:ext,type:MIME[ext],size:f.size,added:Date.now()};
  await tx(['meta','blobs'],'readwrite',function(t){t.objectStore('meta').put(m);return t.objectStore('blobs').put(new Blob([buf],{type:m.type}),m.id)});

function dropStored(m){

  var page=el.querySelector('.dv-page');
  if(m.ext!=='docx'){
    page.innerHTML='<p class="dv-msg">A preview is not available for older .doc files.<br>Tap Share to open it in Word or another app.</p>';
    return;
  }
  try{
    await SKPdfViewer.loadScript(MAMMOTH,function(){return !!window.mammoth});
    var r=await mammoth.convertToHtml({arrayBuffer:await b.arrayBuffer()});
    if(docEl!==el)return;
    page.innerHTML=cleanHtml(r.value)||'<p class="dv-msg">This document is empty.</p>';
  }catch(e){
    if(docEl!==el)return;
    page.innerHTML='<p class="dv-msg">Could not display this document here.<br>Tap Share to open it in another app.</p>';
  }
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  if(e.target===scrim){closeSheet();return}
  var el=e.target.closest('[data-a]');
  if(!el){
    var c=e.target.closest('[data-card]');
    if(c){var k=c.dataset.card,m={plan:'plans',habit:'habits',goal:'goals','class':'classes'}[k],it=find(m,c.dataset.id);if(it)openSheet(k,it)}
    return;
  }
  var a=el.dataset.a,id=el.dataset.id,d=el.dataset;
  if(a==='nav')go(d.v);
  else if(a==='add')openSheet(defaultKind(),null,U.view==='calendar'?{date:U.sel}:{});
  else if(a==='bell')openReminders();
  else if(a==='toggle-plan'){var p=find('plans',id);if(p){setPlanDone(p,!p.done);save();render()}}
  else if(a==='edit-plan')openSheet('plan',find('plans',id));
  else if(a==='toggle-habit'){var h=find('habits',id);if(h){var td=ymd(new Date());if(h.done[td])delete h.done[td];else h.done[td]=true;save();render()}}
  else if(a==='edit-habit')openSheet('habit',find('habits',id));
  else if(a==='toggle-step'){var g=find('goals',id);if(g){g.steps[+d.i].done=!g.steps[+d.i].done;save();render()}}
  else if(a==='edit-goal')openSheet('goal',find('goals',id));
  else if(a==='toggle-chap'){var s=find('subjects',d.sid),c2=s&&s.chapters.find(function(x){return x.id===d.cid});if(c2){setChapDone(s,c2,!c2.done);save();render()}}
  else if(a==='plan-chap'){
    var s2=find('subjects',d.sid),c3=s2&&s2.chapters.find(function(x){return x.id===d.cid}),ep=chapPlan(d.sid,d.cid);
    if(ep)openSheet('plan',ep);else if(c3){var n=new Date();n.setDate(n.getDate()+1);openSheet('plan',null,{title:'Finish '+c3.t,subject:s2.name,chapter:{sid:s2.id,cid:c3.id},date:ymd(n)})}
  }
  else if(a==='edit-subject')openSheet('subject',find('subjects',id));
  else if(a==='edit-class')openSheet('class',find('classes',id));
  else if(a==='month'){
    var dt=new Date(U.month.y,U.month.m+(+d.dir),1);U.month={y:dt.getFullYear(),m:dt.getMonth()};
    var pre=U.month.y+'-'+pad(U.month.m+1)+'-';
    if(U.sel.indexOf(pre)!==0){var t=ymd(new Date());U.sel=t.indexOf(pre)===0?t:pre+'01'}
    render();
  }
  else if(a==='pick-day'){U.sel=d.d;render();var card=$('.dcard.sel');if(card&&card.scrollIntoView)card.scrollIntoView({block:'nearest'})}
  else if(a==='add-on-date')openSheet('plan',null,{date:d.d});
  else if(a==='tt-day'){U.ttDay=+d.i;render()}
  else if(a==='ask-notif')askNotif();
  else if(a==='hide-notice'){S.settings.hideNotice=true;save();render()}
  else if(a==='hide-sample'){S.settings.hideSample=true;save();render()}
  else if(a==='clear-sample'){
    ['plans','habits','goals','subjects','classes'].forEach(function(k){S[k]=S[k].filter(function(x){return !x.sample})});
    S.plans.forEach(function(p){if(p.chapter&&!S.subjects.some(function(s){return s.id===p.chapter.sid}))p.chapter=null});
    save();render();if(U.sheet&&U.sheet.kind==='reminders')openReminders();toast({title:'Examples cleared'});
  }
  else if(a==='test-notif')notify('Dayline test reminder','If you can see this, reminders are working.');
  else if(a==='sync-create')syncCreate();
  else if(a==='sync-join'){var ci=$('#set-code');syncJoin(ci?ci.value:'')}
  else if(a==='sync-copy'){
    var cd=SY.code||'';
    (navigator.clipboard?navigator.clipboard.writeText(cd):Promise.reject()).then(function(){toast({title:'Code copied'})},function(){var r=document.createRange();r.selectNodeContents($('#sync-code'));var sl=getSelection();sl.removeAllRanges();sl.addRange(r);toast({title:'Code selected',body:'Press copy.'})});
  }
  else if(a==='sync-now'){syncNow({force:true});toast({title:'Syncing'})}
  else if(a==='sync-off')syncOff();
  else if(a==='theme'){S.settings.theme=d.v;saveQuiet();applyTheme();$$('[data-a="theme"]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===d.v))})}
  else if(a==='chap-files')toggleChap(d.sid+':'+d.cid);
  else if(a==='files')openFiles(d.sid,d.cid||'',d.k);
  else if(a==='files-tab'){if(U.sheet&&U.sheet.kind==='files')openFiles(U.sheet.sid,U.sheet.cid,d.k)}
  else if(a==='file-add')addFilesPrompt();
  else if(a==='file-open')openFile(id);
  else if(a==='file-share')shareStored(id);
  else if(a==='file-del'){
    if(!el.dataset.armed){
      el.dataset.armed='1';el.classList.add('armed');el.textContent='Delete?';
      setTimeout(function(){if(el.isConnected&&el.dataset.armed){delete el.dataset.armed;el.classList.remove('armed');el.innerHTML=IC.trash}},3500);
    }else{
      filesDelWhere(function(x){return x.id===id});render();
      if(U.sheet&&U.sheet.kind==='files')openFiles(U.sheet.sid,U.sheet.cid,U.sheet.fk);
    }
  }
  else if(a==='sheet-type')openSheet(d.v);
  else if(a==='close-sheet')closeSheet();
  else if(a==='delete'){
    if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Tap again to delete'}else deleteItem();
  }
});
document.addEventListener('submit',function(e){if(e.target.id==='sheet-form'){e.preventDefault();saveSheet()}});
document.addEventListener('change',function(e){
  var t=e.target,tf=t.closest&&t.closest('[data-tf]'),k=tf?tf.dataset.set:(t.dataset&&t.dataset.set);if(!k)return;
  S.settings[k]=tf?tfGet(tf):(t.type==='checkbox'?t.checked:(k==='nagMin'?+t.value:t.value));
  save();render();
});
document.addEventListener('toggle',function(e){
  var d=e.target;
  if(d.matches&&d.matches('details[data-sid]')){if(d.open)U.openSubj.add(d.dataset.sid);else U.openSubj.delete(d.dataset.sid)}
},true);
document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;if(docEl){closeDoc();return}if(window.SKPdfViewer&&SKPdfViewer.isOpen())return;if(!scrim.hidden)closeSheet()});
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick()});
document.addEventListener('pointerdown',function(){try{if(ac&&ac.state==='suspended')ac.resume()}catch(e){}},{passive:true});
/* swipe left/right between pages */
(function(){
  var sx=0,sy=0,st=0,on=false;
  function blocked(t){return !!(t&&t.closest&&t.closest('.nav,.tabs,input,textarea,select,.scrim,.toast,.sheet'))}
  document.addEventListener('touchstart',function(e){
    on=false;
    if(e.touches.length!==1||!scrim.hidden||blocked(e.target))return;
    var t=e.touches[0];
    if(t.clientX<20||t.clientX>window.innerWidth-20)return;
    sx=t.clientX;sy=t.clientY;st=Date.now();on=true;
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(!on)return;on=false;
    var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Date.now()-st>700||Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5)return;
    var sel=window.getSelection&&window.getSelection();if(sel&&String(sel).length>0)return;
    var i=VIEWS.indexOf(U.view),n=dx<0?i+1:i-1;
    if(n<0||n>=VIEWS.length)return;
    go(VIEWS[n],dx<0?'next':'prev');
  },{passive:true});
  document.addEventListener('touchcancel',function(){on=false},{passive:true});
})();
document.addEventListener('visibilitychange',function(){if(!document.hidden)syncNow()});
window.addEventListener('hashchange',function(){var v=hashView();if(v&&v!==U.view){U.view=v;render()}});

render();
tick();
if(SY.code)syncNow();
setInterval(tick,15000);
filesInit().then(function(){render()});
})();
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){})})}
